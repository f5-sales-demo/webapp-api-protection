    content: |
      {"status":"stopped","history":[],"tool_tier":"${tool_tier}"}

  - path: /usr/local/lib/cloud-init-helpers.sh
    permissions: "0644"
    content: |
      #!/bin/sh
      PROGRESS_LOG="/var/log/cloud-init-progress.log"
      log_phase() {
        _phase="$1"; shift
        _msg="$${*:-started}"
        _ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        printf '[%s] [%s] %s\n' "$_ts" "$_phase" "$_msg" | tee -a "$PROGRESS_LOG" >&2
      }
      retry_cmd() {
        _max="$1"; _base="$2"; shift 2
        _attempt=1
        while [ "$_attempt" -le "$_max" ]; do
          if "$@"; then return 0; fi
          if [ "$_attempt" -lt "$_max" ]; then
            _wait=$(( _base * _attempt ))
            log_phase "retry" "attempt $_attempt/$_max failed ($1) — retrying in $${_wait}s"
            sleep "$_wait"
          fi
          _attempt=$(( _attempt + 1 ))
        done
        log_phase "retry" "FAILED after $_max attempts: $1"
        return 1
      }
      fetch_url() {
        _url="$1"; _out="$2"; _desc="$${3:-$1}"
        log_phase "fetch" "$_desc"
        retry_cmd 4 5 curl -fsSL --connect-timeout 15 --max-time 300 -o "$_out" "$_url"
      }
      install_packages() {
        log_phase "apt" "installing: $*"
        retry_cmd 3 10 apt-get install -y -o DPkg::Lock::Timeout=60 "$@"
      }
      clone_repo() {
        _url="$1"; _dest="$2"; _depth="$${3:-1}"
        log_phase "git" "cloning $_url -> $_dest"
        retry_cmd 3 10 git clone --depth "$_depth" --single-branch "$_url" "$_dest"
      }
      wait_for_http() {
        _url="$1"; _max="$2"; _desc="$${3:-$_url}"
        log_phase "health" "waiting for $_desc (max $${_max}s)"
        _elapsed=0
        while [ "$_elapsed" -lt "$_max" ]; do
          if curl -sf --max-time 5 "$_url" >/dev/null 2>&1; then
            log_phase "health" "$_desc ready after $${_elapsed}s"
            return 0
          fi
          sleep 5; _elapsed=$(( _elapsed + 5 ))
        done
        log_phase "health" "TIMEOUT: $_desc not ready after $${_max}s"
        return 1
      }

  # Canonical Python runtime is embedded, never downloaded at boot.
  - path: /usr/local/lib/demo_traffic.py
    permissions: '0755'
    content: |
      ${traffic_script}

  - path: /usr/local/bin/tgen-control
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      if [ "$(id -u)" -ne 0 ]; then
        exec sudo -n /usr/local/bin/tgen-control "$@"
      fi
      export PATH=/opt/traffic-generator/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      exec /usr/bin/python3 /usr/local/lib/demo_traffic.py "$@"

  # Installed from the immutable shared catalog; service starts only after readiness.

runcmd:
  # cloud-init emits all runcmd entries into one /bin/sh script: strictness applies to every phase.
  - |
    set -eu
    trap 'rc=$?; if [ "$rc" -ne 0 ]; then printf "traffic-generator provisioning failed (%s)\n" "$rc" >&2; fi' EXIT
    case '${tool_tier}' in standard|full) ;; *) echo 'Invalid tool tier' >&2; exit 1 ;; esac
    # cloud-init is noninteractive and may not supply HOME; child installers inherit these.
    export HOME=/root XDG_CACHE_HOME=/root/.cache
    export GOPATH=/opt/go GOCACHE=/root/.cache/go-build GOMODCACHE=/opt/go/pkg/mod
    export GOTOOLCHAIN=local
    export PATH=/opt/traffic-generator/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
  # --- Phase 0: Kernel tuning, NIC optimization, system limits ---
  - sysctl --system
  - systemctl daemon-reload
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase0" "kernel tuning and NIC optimization"
    # RPS/RFS: distribute NIC softirqs across all cores
    NCPU=$(nproc)
    RPS_MASK=$(printf '%x' $(( (1 << NCPU) - 1 )))
    NIC=$(ip -o link show | awk -F': ' '/state UP/ && !/lo/{print $2; exit}')
    if [ -n "$NIC" ]; then
      RFS_ENTRIES=$((32768 * NCPU))
      echo "$RFS_ENTRIES" > /proc/sys/net/core/rps_sock_flow_entries
      for rxq in /sys/class/net/"$NIC"/queues/rx-*/rps_cpus; do
        echo "$RPS_MASK" > "$rxq"
      done
      for rxq in /sys/class/net/"$NIC"/queues/rx-*/rps_flow_cnt; do
        RXQ_COUNT=$(ls -d /sys/class/net/"$NIC"/queues/rx-* | wc -l)
        echo "$((RFS_ENTRIES / RXQ_COUNT))" > "$rxq"
      done
      # Maximize NIC ring buffers
      if command -v ethtool >/dev/null 2>&1; then
        RX_MAX=$(ethtool -g "$NIC" 2>/dev/null | awk '/Pre-set.*:/,/^$/{if(/RX:/){print $2; exit}}')
        TX_MAX=$(ethtool -g "$NIC" 2>/dev/null | awk '/Pre-set.*:/,/^$/{if(/TX:/){print $2; exit}}')
        if [ -n "$RX_MAX" ] && [ -n "$TX_MAX" ]; then
          ethtool -G "$NIC" rx "$RX_MAX" tx "$TX_MAX" 2>/dev/null || true
        fi
      fi
      echo "NIC tuning: RPS mask=$RPS_MASK on $NIC"
    fi
    # Transparent Huge Pages for large connection pools
    echo "always" > /sys/kernel/mm/transparent_hugepage/enabled 2>/dev/null || true

  # --- Phase 1: Node.js 24 ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase1" "installing Node.js 24"
    fetch_url 'https://deb.nodesource.com/setup_24.x' /tmp/nodesource-setup.sh 'Node.js repository setup'
    retry_cmd 3 10 bash /tmp/nodesource-setup.sh
    install_packages nodejs

  # --- Phase 2: Python toolchain (uv) ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase2" "installing Python uv"
    fetch_url 'https://astral.sh/uv/install.sh' /tmp/uv-install.sh 'uv installer'
    retry_cmd 4 5 sh /tmp/uv-install.sh
    cp /root/.local/bin/uv /usr/local/bin/uv
    cp /root/.local/bin/uvx /usr/local/bin/uvx

  # --- Phase 3: Security binaries (Go tools via ghlatest) ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase3" "installing security binaries"
    export DPKG_ARCH=$(dpkg --print-architecture)
    export PATH=/usr/local/bin:$PATH

    echo "Installing nuclei..."
    NUCLEI_VER=$(ghlatest projectdiscovery/nuclei)
    fetch_url "https://github.com/projectdiscovery/nuclei/releases/download/v$${NUCLEI_VER}/nuclei_$${NUCLEI_VER}_linux_$${DPKG_ARCH}.zip" /tmp/nuclei.zip "nuclei"
    unzip -oq /tmp/nuclei.zip nuclei -d /usr/local/bin
    rm /tmp/nuclei.zip

    echo "Installing subfinder..."
    SUBFINDER_VER=$(ghlatest projectdiscovery/subfinder)
    fetch_url "https://github.com/projectdiscovery/subfinder/releases/download/v$${SUBFINDER_VER}/subfinder_$${SUBFINDER_VER}_linux_$${DPKG_ARCH}.zip" /tmp/subfinder.zip "subfinder"
    unzip -oq /tmp/subfinder.zip subfinder -d /usr/local/bin
    rm /tmp/subfinder.zip

    echo "Installing httpx..."
    HTTPX_VER=$(ghlatest projectdiscovery/httpx)
    fetch_url "https://github.com/projectdiscovery/httpx/releases/download/v$${HTTPX_VER}/httpx_$${HTTPX_VER}_linux_$${DPKG_ARCH}.zip" /tmp/httpx.zip "httpx"
    unzip -oq /tmp/httpx.zip httpx -d /usr/local/bin
    rm /tmp/httpx.zip

    echo "Installing ffuf..."
    FFUF_VER=$(ghlatest ffuf/ffuf)
    fetch_url "https://github.com/ffuf/ffuf/releases/download/v$${FFUF_VER}/ffuf_$${FFUF_VER}_linux_$${DPKG_ARCH}.tar.gz" /tmp/ffuf.tar.gz 'ffuf'
    tar -xzf /tmp/ffuf.tar.gz -C /usr/local/bin ffuf

    echo "Installing gobuster..."
    GOBUSTER_VER=$(ghlatest OJ/gobuster)
    fetch_url "https://github.com/OJ/gobuster/releases/download/v$${GOBUSTER_VER}/gobuster_Linux_$(uname -m).tar.gz" /tmp/gobuster.tar.gz 'gobuster'
    tar -xzf /tmp/gobuster.tar.gz -C /usr/local/bin gobuster

    echo "Installing feroxbuster..."
    FEROX_VER=$(ghlatest epi052/feroxbuster)
    fetch_url "https://github.com/epi052/feroxbuster/releases/download/v$${FEROX_VER}/feroxbuster_$${DPKG_ARCH}.deb.zip" /tmp/ferox.zip "feroxbuster"
    unzip -oq /tmp/ferox.zip -d /tmp
    dpkg -i /tmp/feroxbuster_*.deb
    rm -f /tmp/ferox.zip /tmp/feroxbuster_*.deb

    echo "Installing dalfox..."
    DALFOX_VER=3.2.3
    [ "$DPKG_ARCH" = "amd64" ] || { echo 'Unsupported Dalfox architecture' >&2; exit 1; }
    fetch_url "https://github.com/hahwul/dalfox/releases/download/v$${DALFOX_VER}/dalfox-v$${DALFOX_VER}-linux-x86_64.tar.gz" /tmp/dalfox.tar.gz 'dalfox 3.2.3 (glibc)'
    # Official asset 566035019 and its .sha256 agree; download hash verified 2026-10-01.
    printf '%s  %s\n' 3b059b6bb55e686b5f240852ea6a6750aa5e35a3b404e4027ffe505e2b60a470 /tmp/dalfox.tar.gz | sha256sum --check --strict -
    tar -xzf /tmp/dalfox.tar.gz -C /usr/local/bin --strip-components=1 "dalfox-v$${DALFOX_VER}-linux-x86_64/dalfox"
    chmod +x /usr/local/bin/dalfox
    rm /tmp/dalfox.tar.gz

    echo "Installing amass..."
    AMASS_VER=$(ghlatest owasp-amass/amass)
    fetch_url "https://github.com/owasp-amass/amass/releases/download/v$${AMASS_VER}/amass_linux_$${DPKG_ARCH}.tar.gz" /tmp/amass.tar.gz "amass"
    mkdir -p /tmp/amass
    tar -xzf /tmp/amass.tar.gz -C /tmp/amass
    cp /tmp/amass/amass_linux_$${DPKG_ARCH}/amass /usr/local/bin/
    rm -rf /tmp/amass /tmp/amass.tar.gz

    echo "Phase 3 complete"

  # --- Phase 3b: High-performance load testing tools ---
  - |
    set -eu
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase3b" "installing load testing tools"
    export DPKG_ARCH=$(dpkg --print-architecture)
    export PATH=/usr/local/bin:$PATH

    # hey v0.1.5 requires Go 1.24; gotestwaf v0.5.9 requires Go 1.25.
    # Source: tagged go.mod files; Go archive digest: https://go.dev/dl/?mode=json.
    echo "Installing checksum-pinned Go 1.26.8..."
    [ "$DPKG_ARCH" = "amd64" ] || { echo 'Unsupported Go architecture' >&2; exit 1; }
    install -d -m 0700 "$XDG_CACHE_HOME" "$GOCACHE" "$GOPATH" "$GOMODCACHE" /opt/go/bin
    install -d -m 0755 /opt/traffic-generator-toolchain
    fetch_url 'https://go.dev/dl/go1.26.8.linux-amd64.tar.gz' /tmp/go.tar.gz 'Go 1.26.8'
    printf '%s  %s\n' d0f743b33e8d8945e6b1f432edd15785c70507121d6e2a723b21285eddf8b57b /tmp/go.tar.gz | sha256sum --check --strict -
    tar -xzf /tmp/go.tar.gz -C /opt/traffic-generator-toolchain
    rm /tmp/go.tar.gz
    export PATH=/opt/traffic-generator-toolchain/go/bin:$PATH
    [ "$(go version)" = 'go version go1.26.8 linux/amd64' ] || { echo 'Unexpected Go version' >&2; exit 1; }
    echo "Installing hey v0.1.5..."
    retry_cmd 3 15 sh -c 'go install github.com/rakyll/hey@v0.1.5'
    cp /opt/go/bin/hey /usr/local/bin/hey

    echo "Installing gotestwaf v0.5.9..."
    retry_cmd 3 15 sh -c 'go install github.com/wallarm/gotestwaf/cmd/gotestwaf@v0.5.9'
    cp /opt/go/bin/gotestwaf /usr/local/bin/gotestwaf
    mkdir -p /opt/gotestwaf
    cp -r /opt/go/pkg/mod/github.com/wallarm/gotestwaf@v0.5.9/config.yaml /opt/gotestwaf/
    cp -r /opt/go/pkg/mod/github.com/wallarm/gotestwaf@v0.5.9/testcases /opt/gotestwaf/
    chown -R azureuser:azureuser /opt/gotestwaf

    echo "Installing checksum-pinned Vegeta 12.12.0..."
    [ "$DPKG_ARCH" = "amd64" ] || { echo 'Unsupported Vegeta architecture' >&2; exit 1; }
    fetch_url 'https://github.com/tsenart/vegeta/releases/download/v12.12.0/vegeta_12.12.0_linux_amd64.tar.gz' /tmp/vegeta.tar.gz 'vegeta 12.12.0'
    # Verified against the upstream v12.12.0 checksums release asset.
    printf '%s  %s\n' e7ce26c8fa4b9e1a3668aa7f82a4d77fca6a6d955f8dd5e843816115cc568450 /tmp/vegeta.tar.gz | sha256sum --check --strict -
    tar -xzf /tmp/vegeta.tar.gz -C /usr/local/bin vegeta
    vegeta -version
    rm /tmp/vegeta.tar.gz

    echo "Phase 3b complete"

  # --- Phase 4: Python security tools ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase4" "installing isolated Python security tools"
    /usr/bin/python3 -m venv /opt/traffic-generator/venv
    /opt/traffic-generator/venv/bin/python -c 'import sys; assert sys.prefix != sys.base_prefix'
    retry_cmd 3 10 timeout 900 /opt/traffic-generator/venv/bin/python -m pip --isolated install --retries 3 --require-hashes -r /opt/traffic-generator/python-tools.lock
    /opt/traffic-generator/venv/bin/python -m pip --isolated check
    for tool in scapy arjun hashid pwn sslyze smbclient.py; do
      timeout 30 /opt/traffic-generator/venv/bin/"$tool" -h >/dev/null
    done
    for tool in mitmproxy mitmdump mitmweb; do
      timeout 30 /opt/traffic-generator/venv/bin/"$tool" --version
    done

  # --- Phase 5: Browser automation ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase5" "installing browser automation tools"
    retry_cmd 3 15 npm install -g playwright puppeteer puppeteer-extra puppeteer-extra-plugin-stealth
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    retry_cmd 3 30 npx --yes playwright install chromium
    retry_cmd 3 30 sh -c 'su - azureuser -c "export NODE_PATH=/usr/lib/node_modules && npx --yes playwright install chromium"'
    retry_cmd 3 30 npx --yes playwright install-deps chromium

  # --- Phase 6: Git-cloned tools ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase6" "cloning tool repositories"
    clone_repo "https://github.com/drwetter/testssl.sh.git" /opt/testssl.sh
    ln -sf /opt/testssl.sh/testssl.sh /usr/local/bin/testssl
    clone_repo "https://github.com/danielmiessler/SecLists.git" /opt/SecLists
    clone_repo "https://github.com/lanmaster53/recon-ng.git" /opt/recon-ng
    clone_repo "https://github.com/smicallef/spiderfoot.git" /opt/spiderfoot
    clone_repo "https://github.com/nemesida-waf/waf-bypass.git" /opt/waf-bypass
    clone_repo "https://github.com/swisskyrepo/PayloadsAllTheThings.git" /opt/PayloadsAllTheThings

  # --- Phase 7: Every catalog requires the full ZAP/browser runtime ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase7" "installing required full-catalog tools"
    install_packages default-jre-headless
    ZAP_VER=2.17.0
    fetch_url "https://github.com/zaproxy/zaproxy/releases/download/v$${ZAP_VER}/ZAP_$${ZAP_VER}_Linux.tar.gz" /tmp/zap.tar.gz 'ZAP 2.17.0'
    printf '%s  %s\n' efe799aaa3627db683b43f00c9c210aea0b75c00cc8f0a0f0434d12bb3ddde5a /tmp/zap.tar.gz | sha256sum --check --strict -
    tar -xzf /tmp/zap.tar.gz -C /opt
    ln -sfn /opt/ZAP_$${ZAP_VER} /opt/zaproxy
    printf '#!/bin/sh\nexec /opt/zaproxy/zap.sh "$@"\n' > /usr/local/bin/zap
    chmod +x /usr/local/bin/zap
    timeout 60 zap -version

  # ZAP DOM-XSS uses the separately pinned headless Firefox driver.
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    fetch_url 'https://archive.mozilla.org/pub/firefox/releases/157.0/linux-x86_64/en-US/firefox-157.0.tar.xz' /tmp/firefox.tar.xz 'Firefox 157.0'
    printf '%s  %s\n' 42f2c62a562316982ef5a796738c57602bf84a984f5c616e80bcff4627f78fff /tmp/firefox.tar.xz | sha256sum --check --strict -
    tar -xJf /tmp/firefox.tar.xz -C /opt
    ln -sfn /opt/firefox/firefox /usr/local/bin/firefox
    fetch_url 'https://github.com/mozilla/geckodriver/releases/download/v0.37.1/geckodriver-v0.37.1-linux64.tar.gz' /tmp/geckodriver.tar.gz 'geckodriver 0.37.1'
    printf '%s  %s\n' e815130ea95983e162ae91843b48d3a3ce991735635fce83a647afde21e09f7e /tmp/geckodriver.tar.gz | sha256sum --check --strict -
    tar -xzf /tmp/geckodriver.tar.gz -C /usr/local/bin
    firefox --version
    geckodriver --version

  # Offline scanner templates are catalog prerequisites, pinned independently.
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    fetch_url 'https://codeload.github.com/projectdiscovery/nuclei-templates/tar.gz/fb76120d9969f53d00524d15a0cd16edb4986072' /tmp/nuclei-templates.tar.gz 'pinned Nuclei templates'
    printf '%s  %s\n' d28d3d6e0b4401eac04f7ad5ccb2295e2df8194d179c13f2ee47d06f91b39edb /tmp/nuclei-templates.tar.gz | sha256sum --check --strict -
    mkdir -p /opt/nuclei-templates
    tar -xzf /tmp/nuclei-templates.tar.gz --strip-components=1 -C /opt/nuclei-templates

  # --- Phase 8: verified shared generator installation ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase8" "installing immutable shared traffic catalog"
    fetch_url "https://raw.githubusercontent.com/f5-sales-demo/traffic-generator/${generator_commit}/scripts/install_catalog.py" /tmp/install-catalog.py 'immutable catalog installer'
    printf '%s  %s\n' '${installer_sha256}' /tmp/install-catalog.py | sha256sum --check --strict -
    python3 /tmp/install-catalog.py --commit '${generator_commit}' --sha256 '${generator_sha256}'
    ln -sfn /opt/SecLists /opt/seclists
    if [ ! -f /opt/seclists/Passwords/Common-Credentials/best15.txt ]; then
      printf '%s\n' password 123456 admin admin123 letmein welcome changeme password1 qwerty abc123 12345678 test secret demo synthetic > /opt/seclists/Passwords/Common-Credentials/best15.txt
    fi
    install -m 0755 /opt/traffic-generator/current/scripts/tgen-control /usr/local/bin/tgen-control
    install -m 0644 /opt/traffic-generator/current/scripts/tgen-continuous.service /etc/systemd/system/tgen-continuous.service
    python3 - <<'PYCONFIG'
    import json, os
    config = {
        "schema_version": 1, "domains": ${target_domains}, "protocol": "https",
        "http_rps": 200, "benign_rps": 180, "attack_rps": 20,
        "connection_rps": 20, "slow_connections": 20,
        "csd_enabled": False, "protections_enabled": True,
        "scenario_timeout_seconds": 900, "retention_days": 7,
        "retention_bytes": 10737418240,
        "results_dir": "/opt/traffic-generator/runtime",
        "source_commit": "${generator_commit}", "artifact_sha256": "${generator_sha256}"
    }
    path = "/opt/traffic-generator/catalog-config.json"
    with open(path, "w") as stream: json.dump(config, stream)
    os.chmod(path, 0o600)
    PYCONFIG

  # --- Phase 9: Smoke test and status update ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "phase9" "running smoke test"
    export NODE_PATH=/usr/lib/node_modules
    export PATH=/opt/traffic-generator/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    PASS=0; FAIL=0
    TOOLS='nmap nikto sqlmap nuclei dalfox ffuf gobuster feroxbuster subfinder httpx sslscan hydra john hashcat masscan hping3 tshark wrk hey vegeta ab testssl arjun gotestwaf node npx playwright scapy hashid pwn mitmproxy mitmdump mitmweb sslyze smbclient.py'
    TOOLS="$TOOLS zap java"
    for tool in $TOOLS; do
      if command -v "$tool" >/dev/null 2>&1; then PASS=$((PASS+1)); else FAIL=$((FAIL+1)); echo "MISSING: $tool"; fi
    done
    if [ "$FAIL" -eq 0 ]; then STATUS="ready"; else STATUS="degraded"; fi
    log_phase "phase9" "smoke test complete: $PASS passed, $FAIL failed"
    printf '{"status":"%s","tool_tier":"${tool_tier}","tools_pass":%d,"tools_fail":%d,"timestamp":"%s"}\n' \
      "$STATUS" "$PASS" "$FAIL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > /opt/traffic-generator/status.json
    [ "$FAIL" -eq 0 ] || exit 1

  # Provision STOPPED. Lifecycle readiness must succeed before tgen-control start.
  - |
    set -eu
    systemctl daemon-reload
    systemctl disable --now tgen-continuous.service
    systemctl stop tgen-continuous.service
    printf '{"status":"stopped","history":[],"tool_tier":"${tool_tier}"}\n' > /opt/traffic-generator/status.json

  # --- Completion ---
  - |
    . /usr/local/lib/cloud-init-helpers.sh
    log_phase "complete" "traffic-generator provisioned"
