  - path: /usr/local/bin/demo-origin-provision
    permissions: "0755"
    content: |
      #!/bin/bash
      set -Eeuo pipefail
      . /usr/local/lib/cloud-init-helpers.sh
      trap 'log_phase failed "origin provisioning aborted at line $LINENO"' ERR
      log_phase init "origin-server provisioning started"
      sed -i 's/ENABLED="false"/ENABLED="true"/' /etc/default/sysstat
      systemctl enable --now sysstat
      sysctl -p /etc/sysctl.d/99-origin-server.conf
      install -m 0755 -d /etc/apt/keyrings
      fetch_url "https://download.docker.com/linux/ubuntu/gpg" /etc/apt/keyrings/docker.asc "Docker GPG key"
      chmod a+r /etc/apt/keyrings/docker.asc
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
      retry_cmd 3 10 timeout 300 apt-get update
      # download.docker.com/linux/ubuntu/dists/noble/stable/binary-amd64/Packages.gz receipts, 2026-09-30.
      install_packages 'docker-ce=5:29.8.1-1~ubuntu.24.04~noble' 'docker-ce-cli=5:29.8.1-1~ubuntu.24.04~noble' \
        'containerd.io=2.3.6-1~ubuntu.24.04~noble' 'docker-buildx-plugin=0.37.1-1~ubuntu.24.04~noble' \
        'docker-compose-plugin=5.5.1-1~ubuntu.24.04~noble' git python3
      systemctl enable --now docker
      systemctl daemon-reload
      ln -sf /etc/nginx/sites-available/origin-server /etc/nginx/sites-enabled/origin-server
      rm -f /etc/nginx/sites-enabled/default
      nginx -t
      systemctl enable nginx
      # Package installation may already have started nginx with the default site.
      systemctl restart nginx
      # GitHub commits/main receipt 2026-09-30; upstream poetry.lock pins RESTaurant dependencies.
      git init /opt/origin-server/restaurant
      git -C /opt/origin-server/restaurant remote add origin https://github.com/theowni/Damn-Vulnerable-RESTaurant-API-Game.git
      retry_cmd 3 10 timeout 120 git -C /opt/origin-server/restaurant fetch --depth 1 origin d32d09972aec7830f5f1d4a5d274cac7aae7eb82
      git -C /opt/origin-server/restaurant checkout --detach FETCH_HEAD
      test "$(git -C /opt/origin-server/restaurant rev-parse HEAD)" = d32d09972aec7830f5f1d4a5d274cac7aae7eb82
      # Pin upstream builder/runtime bases while retaining its vulnerable code and locked dependencies.
      sed -i 's|python:3.10-bookworm|python@sha256:0a06143d04e5207c0561a9803a007af1d3e7941634fd1a7f801079dca3644bf5|; s|python:3.10-slim-bookworm|python@sha256:2559be987fd64d61badbdafd303ea58a9ccab36d6c3c08bce219e762177d2eca|; s| --without-hashes||' /opt/origin-server/restaurant/Dockerfile
      cd /opt/origin-server
      timeout 1200 docker compose build
      # Serialize shared RESTaurant migrations before replicas start (no concurrent alembic).
      timeout 180 docker compose up -d --wait --wait-timeout 120 restaurant-db
      timeout 120 docker compose run --rm --no-deps --workdir /app restaurant-1 sh -euc 'alembic upgrade head; python -c "import main"'
      timeout 900 docker compose up -d --wait --wait-timeout 840
      # Shared DVWA DB and each VAmPI replica must initialize before functional readiness.
