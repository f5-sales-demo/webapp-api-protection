#cloud-config
package_update: true
packages: [ca-certificates, curl, nginx, python3, sysstat, git]
write_files:
  - path: /usr/local/lib/demo-dvwa-session-cleanup.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Schedule bounded anonymous DVWA session retention
      [Timer]
      OnBootSec=5m
      OnUnitActiveSec=5m
      Persistent=true
      [Install]
      WantedBy=timers.target
  - path: /usr/local/lib/demo-dvwa-session-cleanup.py
    permissions: '0755'
    content: |
      ${session_retention_script}
  - path: /usr/local/bin/demo-seed-catalog
    permissions: '0700'
    content: |
      ${catalog_seed_script}
  - path: /usr/local/bin/bootstrap-origin
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      stage=$(mktemp -d)
      trap 'rm -rf "$stage"' EXIT
      curl --fail --location --retry 3 --max-time 120 "https://raw.githubusercontent.com/f5-sales-demo/origin-server/${origin_commit}/scripts/install-release.sh" -o "$stage/install-release.sh"
      printf '%s  %s\n' '${origin_installer_sha256}' "$stage/install-release.sh" | sha256sum --check --status
      bash "$stage/install-release.sh" '${origin_commit}' '${origin_archive_sha256}' '${origin_python_installer_sha256}'
runcmd:
  - [bash, /usr/local/bin/bootstrap-origin]
  - [install, -m, '0755', /usr/local/lib/demo-dvwa-session-cleanup.py, /usr/local/bin/demo-dvwa-session-cleanup]
  - [install, -m, '0644', /usr/local/lib/demo-dvwa-session-cleanup.timer, /etc/systemd/system/demo-dvwa-session-cleanup.timer]
  - [install, -m, '0755', /usr/local/bin/demo-seed-catalog, /usr/local/bin/demo-catalog-fixtures]
  - [python3, /usr/local/bin/demo-seed-catalog, --seed]
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, demo-dvwa-session-cleanup.timer]
