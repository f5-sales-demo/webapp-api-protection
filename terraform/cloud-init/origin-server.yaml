  - path: /etc/nginx/sites-available/origin-server
    content: |
      server {
          listen 80 reuseport backlog=4096;
          server_name _;

          location /health {
              access_log off;
              return 200 '{ "status":"healthy","component":"origin-server","applications":["juice-shop","dvwa","vampi","httpbin","whoami","csd-demo","dvga","restaurant","crapi"] }' ;
              add_header Content-Type application/json;
          }

          location / {
              root /var/www/html;
              index index.html;
          }

          location /juice-shop/ {
              proxy_pass http://juice_shop/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header X-Forwarded-Prefix /juice-shop;
                    proxy_cache juice_cache;
                    proxy_cache_valid 200 60s;
                    proxy_cache_key "$request_uri";
                    add_header X-Cache-Status $upstream_cache_status;
          }

          location /dvwa/ {
              proxy_pass http://dvwa/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /vampi/ {
              proxy_pass http://vampi/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /httpbin/ {
              proxy_pass http://httpbin_up/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /whoami/ {
              proxy_pass http://whoami_up/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /csd-demo/ {
              proxy_pass http://csd_demo/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /dvga/ {
              proxy_pass http://dvga_graphql/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }

          # Synthetic DemoApp-compatible fixtures: no real SQL engine or script execution.
          location = /WAF/SQL {
              add_header X-Demo-Fixture "synthetic-demoapp-sql" always;
              default_type application/json;
              return 200 '{"fixture":"synthetic DemoApp-compatible SQL","executed":false}';
          }
          location = /WAF/XSS {
              add_header X-Demo-Fixture "synthetic-demoapp-xss" always;
              default_type application/json;
              return 200 '{"fixture":"synthetic DemoApp-compatible XSS","executed":false}';
          }
          location /crapi/ {
              proxy_pass http://127.0.0.1:8888/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_redirect / /crapi/;
          }

          location /restaurant/ {
              proxy_pass http://restaurant/;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

      server {
          listen 8888;
          server_name _;

          location /health {
              access_log off;
              return 200 '{"status":"healthy","component":"crapi"}';
              add_header Content-Type application/json;
          }

          location / {
              proxy_pass http://127.0.0.1:18888;
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }

